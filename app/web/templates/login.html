<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMQ2API 登录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='suki-ui.css') }}">
</head>
<body>
    <main class="login-page">
        <div class="login-shell">
            <section class="login-hero glass-panel">
                <div class="login-kicker">Admin Access</div>
                <h1 class="login-title">AMQ2API 管理后台登录</h1>
                <p class="login-copy">使用管理员 API 密钥进入后台。</p>
                <div class="feature-list">
                    <article class="feature-item">
                        <div class="feature-mark">01</div>
                        <div>
                            <p class="feature-title">账号管理</p>
                            <p class="feature-copy">查看账号状态、刷新 Token、导入账号。</p>
                        </div>
                    </article>
                    <article class="feature-item">
                        <div class="feature-mark">02</div>
                        <div>
                            <p class="feature-title">调用统计</p>
                            <p class="feature-copy">查看请求量和 Token 趋势。</p>
                        </div>
                    </article>
                    <article class="feature-item">
                        <div class="feature-mark">03</div>
                        <div>
                            <p class="feature-title">密钥管理</p>
                            <p class="feature-copy">创建、禁用和删除 API 密钥。</p>
                        </div>
                    </article>
                </div>
            </section>

            <section class="login-card glass-panel">
                <h1>管理员登录</h1>
                <p>输入管理员 API 密钥后进入后台。</p>

                <div class="alert alert-error" id="error-alert" style="display: none;"></div>

                <div class="helper-box">
                    <strong>默认管理员密钥</strong>
                    首次部署后可使用默认密钥登录，进入后台后建议尽快更换。
                    <code>amq-admin-default-key-change-immediately</code>
                </div>

                <form id="login-form">
                    <div class="form-group">
                        <label for="api-key">管理员 API 密钥</label>
                        <input
                            class="field"
                            type="password"
                            id="api-key"
                            name="api-key"
                            placeholder="请输入管理员 API 密钥"
                            required
                            autofocus
                        >
                    </div>

                    <div class="login-actions">
                        <button type="submit" class="btn btn-primary">登录后台</button>
                        <button type="button" class="text-button" onclick="document.getElementById('api-key').focus()">聚焦到密钥输入框</button>
                    </div>
                </form>
            </section>
        </div>
    </main>

    <script>
        const loginForm = document.getElementById('login-form');
        const errorAlert = document.getElementById('error-alert');
        const apiKeyInput = document.getElementById('api-key');

        function showError(message) {
            errorAlert.textContent = message;
            errorAlert.style.display = 'block';
        }

        function hideError() {
            errorAlert.textContent = '';
            errorAlert.style.display = 'none';
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const apiKey = apiKeyInput.value.trim();
            hideError();

            if (!apiKey) {
                showError('请输入 API 密钥');
                return;
            }

            try {
                const response = await fetch('/admin/stats/accounts', {
                    headers: {
                        'Authorization': `Bearer ${apiKey}`
                    }
                });

                if (response.status === 401 || response.status === 403) {
                    showError('API 密钥无效或权限不足');
                    return;
                }

                if (!response.ok) {
                    throw new Error('验证失败');
                }

                localStorage.setItem('admin_api_key', apiKey);
                window.location.href = '/admin/dashboard';
            } catch (error) {
                showError('验证失败，请检查网络连接');
            }
        });

        const savedKey = localStorage.getItem('admin_api_key');
        if (savedKey) {
            apiKeyInput.value = savedKey;
        }
    </script>
</body>
</html>
